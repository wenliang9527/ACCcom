name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master, main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Format check
        run: |
          dotnet format ACCcom.sln whitespace --verify-no-changes --no-restore
          dotnet format ACCcom.sln style --verify-no-changes --no-restore
          dotnet format ACCcom.sln analyzers --verify-no-changes --no-restore

      - name: Test
        # 吞吐基准（RxHotPathBenchmarkTests）不在覆盖率采集下跑：插桩会把
        # 被测热循环拖慢一个数量级，测出来的是插桩开销而非回归，见下 Benchmarks。
        run: dotnet test --configuration Release --no-build --logger trx --collect:"XPlat Code Coverage" --results-directory ./TestResults --filter "FullyQualifiedName!~RxHotPathBenchmarkTests"

      - name: Benchmarks (no coverage)
        run: dotnet test tests/ACCcom.Core.Tests/ACCcom.Core.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~RxHotPathBenchmarkTests"

      - name: Coverage gate (Core >= 80%)
        run: |
          dotnet test tests/ACCcom.Core.Tests/ACCcom.Core.Tests.csproj --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults/Coverage --filter "FullyQualifiedName!~RxHotPathBenchmarkTests"
          $xml = [xml](Get-Content (Get-ChildItem ./TestResults/Coverage -Recurse -Filter coverage.cobertura.xml | Select-Object -First 1 -ExpandProperty FullName))
          $rate = [double]$xml.coverage.'lines-covered' / [double]$xml.coverage.'lines-valid'
          Write-Host ("Core line coverage: {0:P1} ({1}/{2})" -f $rate, $xml.coverage.'lines-covered', $xml.coverage.'lines-valid')
          if ($rate -lt 0.80) { throw "Core line coverage below 0.80 gate" }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/TestResults/*.trx
            **/TestResults/**/*.xml

      - name: Publish WPF app
        run: |
          dotnet publish src/ACCcom/ACCcom.csproj `
            --configuration Release `
            --output dist/ACCcom `
            --self-contained true `
            --runtime win-x64 `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Publish MCP server
        run: |
          dotnet publish src/ACCcom.McpServer/ACCcom.McpServer.csproj `
            --configuration Release `
            --output dist/ACCcom.McpServer `
            --self-contained true `
            --runtime win-x64

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ACCcom-win-x64
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ACCcom-win-x64
          path: dist

      - name: Compress artifacts
        run: |
          Compress-Archive -Path dist/ACCcom -DestinationPath ACCcom-$env:GITHUB_REF_NAME.zip
          Compress-Archive -Path dist/ACCcom.McpServer -DestinationPath ACCcom.McpServer-$env:GITHUB_REF_NAME.zip

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ACCcom-*.zip
            ACCcom.McpServer-*.zip
          tag_name: ${{ github.ref_name }}
          name: ACCcom ${{ github.ref_name }}
          body: |
            See [CHANGELOG](https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}) for changes.
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
